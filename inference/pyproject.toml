[project]
name = "flight-event-inference"
version = "0.1.0"
description = "Pilot performance groups from flight telemetry, plus an out-of-scope event classification pipeline"
requires-python = ">=3.9,<3.13"
dependencies = [
    "pandas>=1.5.0,<4.0.0",
    "numpy>=1.23.0,<3.0.0",
    "scikit-learn>=1.2.0,<2.0.0",
    "joblib>=1.2.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pilot_inference"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
