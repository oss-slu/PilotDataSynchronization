---
name: Meson Build System

# Builds the plugin and relay on every branch push and pull request, and keeps
# both files as workflow artifacts. The path filters are commented out to
# facilitate testing. Tags are built by release.yml, which calls this workflow.
on:
  push:
    branches: ['**']
    # paths:
    #   - "**.cpp"
    #   - "**.h"
  pull_request:
    # paths:
    #   - "**.cpp"
    #   - "**.h"
  workflow_dispatch:
  # Lets release.yml reuse this build instead of repeating its steps.
  workflow_call:

# Minimum permissions for SBOM generation and attestation:
#   contents: read           - check out the repository
#   id-token: write          - OIDC token for Sigstore signing (actions/attest)
#   attestations: write      - store the attestation on GitHub
#   artifact-metadata: write - link the attestation to the uploaded artifact
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-on-windows:
    name: Build the plugin and relay on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # I need to find a better place to put this `ci_requirements.txt` file.
      # Right now, it is just in the project root.
      - name: Install Dependencies with Python Pip
        run: pip install -r ci_requirements.txt

      - name: Setup and Build Meson Project on Windows
        run: | 
          cd xplane_plugin/
          meson setup build
          meson compile -C build

      - name: Build the relay
        working-directory: relay
        run: cargo build --release

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: xplane_plugin/build/PilotDataSync.xpl
          if-no-files-found: error

      - name: Upload the relay
        uses: actions/upload-artifact@v4
        with:
          name: relay
          path: relay/target/release/relay.exe
          if-no-files-found: error
      # - name: Test the Meson Project
      #   run: |
      #     cd xplane_plugin/
      #     ./build/testsuite --verbose~

      # if tests fail, upload a test log?
      #- name: Upload Test Log
      #  uses: actions/upload-artifact@v4
      #  if: failure()
      #  with:
      #    name: Windows_Meson_Testlog
      #    path: builddir/meson-logs/testlog.txt

      # --- Supply-chain security: SBOM generation, preservation, attestation ---
      # Scans the plugin tree after the build so that both the build output and
      # the dependency manifests (e.g. baton's Cargo.lock) are in scope.
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: xplane_plugin
          format: spdx-json
          output-file: pilot-data-sync-sbom.spdx.json
          syft-version: v1.52.0
          upload-artifact: false

      - name: Summarize SBOM contents
        shell: python
        run: |
          import json, os
          with open("pilot-data-sync-sbom.spdx.json", encoding="utf-8") as f:
              sbom = json.load(f)
          packages = sorted(
              {(p.get("name", ""), p.get("versionInfo", "")) for p in sbom.get("packages", [])}
          )
          lines = [
              "## SBOM summary",
              "",
              f"**{len(packages)} packages** cataloged in `pilot-data-sync-sbom.spdx.json`",
              "",
              "| Package | Version |",
              "|---|---|",
          ]
          lines += [f"| {name} | {version} |" for name, version in packages]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v6
        with:
          name: pilot-data-sync-sbom
          path: pilot-data-sync-sbom.spdx.json

      - name: Attest SBOM provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: pilot-data-sync-sbom.spdx.json


